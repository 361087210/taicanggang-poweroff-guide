# ============================================================
# 飞书云端数据 → 网页版镜像同步 (V10.14.3 数据同步修复)
# ============================================================
# 背景: 飞书OpenAPI响应头不带Access-Control-Allow-Origin,网页版直接
#      fetch飞书API被浏览器CORS策略100%拦截(安卓版靠cordova原生HTTP
#      层绕过)。方案: 服务端定时镜像飞书云端数据到仓库web-data/目录,
#      网页版从同源路径读取,实现网页版与安卓版数据同步。
#
# 数据流: 组长安卓端上传 → 飞书云盘 → [本工作流定时镜像] → web-data/
#        → [本工作流直接部署Pages] → 网页版同源fetch(60秒轮询感知)
#
# ⚠️ 关键设计说明(V1.1): Pages重部署为什么在本工作流内直接做?
#   GitHub防递归机制规定: 工作流用自带GITHUB_TOKEN推送不会触发其他
#   工作流(push事件静默)。若指望deploy-pages.yml被镜像push唤醒,
#   数据将永远到不了线上。因此镜像+部署在同一任务同一工作区内完成:
#   同步脚本push后,后续部署步骤直接用当前工作区(含最新web-data)
#   构建并部署Pages,零跨工作流依赖。
#
# 节奏: 每5分钟镜像一次。⚠️ 实测本仓库GitHub cron调度不可靠(CodeQL周级
#       定时也常丢),故V2.0采用"链式自续期"为主、cron为兜底:
#       每轮运行结束时用GITHUB_TOKEN触发workflow_dispatch拉起下一轮——
#       官方文档明确workflow_dispatch/repository_dispatch是GITHUB_TOKEN
#       反递归规则的例外,可以正常创建新运行;cron仅在链断裂时复活链条。
#       无数据变化时(changed=false)跳过提交与部署,零开销。
# 密钥: 复用Android/IOS CI已有的 FEISHU_APP_ID / FEISHU_APP_SECRET /
#       FEISHU_FOLDER_TOKEN 仓库Secrets,无需额外配置。
# ============================================================
name: Sync Web Data from Feishu

on:
  schedule:
    - cron: '*/5 * * * *'   # 每5分钟(即时同步上限,GitHub调度最短间隔)
  push:                      # 同步链路自身代码变更时立即执行一次镜像
    branches: [main]         # (GITHUB_TOKEN的推送不会触发本工作流,无循环风险)
    paths:
      - 'scripts/sync_web_data.js'
      - '.github/workflows/sync-web-data.yml'
  workflow_dispatch:          # 支持手动触发立即同步

permissions:
  contents: write             # 镜像结果需提交回main
  pages: write                # 直接部署Pages(见上关键设计说明)
  id-token: write              # deploy-pages@v5 OIDC要求
  actions: write               # 链式自续期: GITHUB_TOKEN触发workflow_dispatch

concurrency:
  group: pages                # 与deploy-pages.yml共用组: 串行化镜像写入+
  cancel-in-progress: false   # 部署互斥(重叠时排队等待,互不取消)

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 镜像+Pages部署+续链sleep(4min)需充足余量
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0          # pull --rebase 需要远端历史
          persist-credentials: true

      # 使用runner自带Node(≥18,支持全局fetch),无需setup-node
      - name: Run Feishu mirror sync
        id: sync
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
        run: node scripts/sync_web_data.js

      - name: Show mirror result
        if: always()
        run: |
          echo "=== web-data 镜像内容 ==="
          ls -la web-data/ 2>/dev/null || echo "(web-data目录尚未创建——飞书云端暂无数据或密钥缺失)"
          cat web-data/meta.json 2>/dev/null || true
          echo "changed=${{ steps.sync.outputs.changed }}"

      # ---------- 以下为Pages直接部署(仅数据变化时执行) ----------
      # 工作区即最新状态(同步脚本刚commit+push),无需重新checkout
      - name: Prepare publish directory
        if: steps.sync.outputs.changed == 'true'
        run: |
          mkdir -p _publish
          cp index.html _publish/
          cp demo.html _publish/
          cp manifest.json _publish/
          cp sw.js _publish/
          cp feishu-api.js _publish/
          cp vehicles_data.js _publish/
          cp version.json _publish/
          cp icon-*.png _publish/ 2>/dev/null || true
          cp icon.svg _publish/ 2>/dev/null || true
          cp -r css _publish/
          cp -r js _publish/
          cp -r vendor _publish/
          cp -r vehicle_images _publish/
          # web-data为镜像数据目录(此时必然存在,changed=true意味着刚写入)
          cp -r web-data _publish/
          echo "web-data files:"
          ls -la _publish/web-data/
          echo "Publish dir contents:"
          ls -la _publish/

      - name: Setup Pages
        if: steps.sync.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_publish'

      - name: Deploy to GitHub Pages
        if: steps.sync.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      # ---------- 链式自续期(V2.0): 用workflow_dispatch拉起下一轮 ----------
      # 背景: 本仓库GitHub cron实测不可靠(*/5从未触发,周级cron也常丢),
      #      而官方文档明确workflow_dispatch是GITHUB_TOKEN反递归规则的例外
      #      → 每轮运行结束时自触发下一轮,形成5分钟周期的可靠调度链。
      # 防分裂: 若近5分钟内存在除本次外的其他运行(说明cron/手动等并发触发源
      #      活跃),本轮跳过续链——多余的链会自然收敛消失,不会指数增长。
      # 断链自愈: cron(低频但偶发触发)或手动workflow_dispatch可复活链条。
      - name: Re-arm next sync (self-perpetuating chain)
        if: always() && steps.sync.outputs.armed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date +%s)
          RECENT=$(gh run list --workflow=sync-web-data.yml --limit=15 --json databaseId,createdAt \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(($NOW - (.createdAt | fromdateiso8601)) < 300)] | length")
          if [ "$RECENT" -gt 0 ]; then
            echo "检测到并发触发源(${RECENT}个近期运行),跳过续链防分裂"
            exit 0
          fi
          sleep 240   # 节奏控制: 镜像~1min + sleep 4min ≈ 5分钟周期
          gh workflow run sync-web-data.yml
          echo "✅ 已续链下一轮(5分钟周期)"
