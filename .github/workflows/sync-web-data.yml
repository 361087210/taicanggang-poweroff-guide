name: Sync Web Data Mirror

on:
  schedule:
    # 每 15 分钟把飞书云端数据镜像到 web-data/, 保证网页版注册/播放数据新鲜
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_web_data.js'
      - '.github/workflows/sync-web-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate web-data mirror from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
        run: node scripts/sync_web_data.js --out web-data

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web-data/
          if git diff --cached --quiet; then
            echo "web-data 无变化, 跳过提交"
          else
            git commit -m "chore: 自动同步网页镜像 web-data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
