name: Sync Web Data Mirror

on:
  schedule:
    # 每 15 分钟把飞书云端数据镜像到 web-data/, 保证网页版注册/播放数据新鲜
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_web_data.js'
      - 'scripts/gen_vehicles_data.js'
      - 'scripts/gen_media_mapping.js'
      - '.github/workflows/sync-web-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate web-data mirror from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
        run: node scripts/sync_web_data.js --out web-data

      # P1 数据一致性根治: 把最新镜像反向写回 App 打包内置源 vehicles_data.js,
      # 并同步重生成车型映射表 + 媒体 manifest(三者收敛为同一份事实; 幂等, 无变化不写)
      - name: Reverse-generate vehicles_data.js + media mapping/manifest
        run: |
          node scripts/gen_vehicles_data.js
          node scripts/gen_media_mapping.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web-data/ vehicles_data.js docs/vehicle_media_mapping.json docs/vehicle_media_mapping.csv docs/vehicle_media_manifest.json
          if git diff --cached --quiet; then
            echo "无变化, 跳过提交"
          else
            git commit -m "chore: 自动同步数据 (web-data + vehicles_data + manifest) ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
