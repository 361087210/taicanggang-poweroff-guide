name: Sync Web Data Mirror

on:
  schedule:
    # 每 15 分钟把飞书云端数据镜像到 web-data/, 保证网页版注册/播放数据新鲜
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_web_data.js'
      - 'scripts/gen_vehicles_data.js'
      - 'scripts/gen_media_mapping.js'
      - '.github/workflows/sync-web-data.yml'
  workflow_dispatch:

permissions:
  contents: write
  # 失败自动登记 issue / 成功自动关闭, 需要 issues: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Generate web-data mirror from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
        run: node scripts/sync_web_data.js --out web-data

      # 生成即校验: 产物一旦未通过脱敏复核即**阻断本次自动提交**,
      #   防止未脱敏数据被推到公开 GitHub Pages。校验对象与 CI 同一脚本、同一口径。
      - name: Gate web-data sanitization (block publish if leaked)
        run: node scripts/check_web_data_sanitization.js web-data

      # P1 数据一致性根治: 把最新镜像反向写回 App 打包内置源 vehicles_data.js,
      # 并同步重生成车型映射表 + 媒体 manifest(三者收敛为同一份事实; 幂等, 无变化不写)
      - name: Reverse-generate vehicles_data.js + media mapping/manifest
        run: |
          node scripts/gen_vehicles_data.js
          # V10.26.6: 车型改名后, 媒体目录与引用必须跟着改名(幂等; 冲突只报告不动手)。
          #   不迁移的话: 旧目录变"无主目录", 引用全部 404, 资源库只能标"改名失配"。
          node scripts/migrate_vehicle_rename.js --apply
          node scripts/migrate_vehicle_rename.js --json > /tmp/rename-plan.json
          node -e "const p=require('/tmp/rename-plan.json');if((p.moves||[]).length){console.error('改名迁移未完成, 仍有',p.moves.length,'项待迁移');process.exit(1)};console.log('改名迁移: 无待处理项 ✓')"
          # V10.26.3: 云端 photoPaths 指向车型目录、而文件实际在 _共享/ 时回写引用(幂等)。
          #   不回写的话每次同步都会把 31 条 404 引用写回产物(audit C7「引用失配」)。
          node scripts/fix_shared_refs.js
          node scripts/fix_shared_refs.js --verify
          node scripts/gen_media_mapping.js
          node scripts/gen_media_library.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web-data/ vehicles_data.js media_library.json docs/vehicle_media_mapping.json docs/vehicle_media_mapping.csv docs/vehicle_media_manifest.json
          if git diff --cached --quiet; then
            echo "无变化, 跳过提交"
          else
            git commit -m "chore: 自动同步数据 (web-data + vehicles_data + manifest) ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      # 恢复即自动关单: 失败 issue 不再需要人肉收尾
      - name: Close auto-filed failure issue on success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE='[auto] web-data 镜像同步失败（cron）'
          JQ="map(select(.title==\"$TITLE\")) | .[0].number // empty"
          ID=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                 --json number,title --jq "$JQ" || true)
          if [ -n "${ID:-}" ]; then
            gh issue close "$ID" --repo "$GITHUB_REPOSITORY" \
              --comment "已恢复：本次同步成功（run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}）。"
          else
            echo "无待关闭的自动登记 issue"
          fi

  # 失败必须报到人眼前:
  #   2026-11-09 → 2026-11-23 这条 cron 连续红了 49 次而无人察觉(镜像静默冻结两周)。
  #   红着没人看的流水线等于没有流水线, 所以失败即开(或刷新)一张 issue。
  notify-failure:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or refresh the auto issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='[auto] web-data 镜像同步失败（cron）'
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          ## web-data 镜像同步失败（自动登记）

          - 失败运行：$RUN_URL
          - 失败步骤：\`Generate web-data mirror from Feishu\`（或其后任一校验/提交步骤）
          - 影响：\`web-data/\` 镜像与 \`vehicles_data.js\` / 媒体映射都不再刷新，网页端会继续吃旧镜像。

          ### 排查顺序
          1. 打开上面的运行日志，搜 \`::error::[mirror]\`。熔断会把**本次实际取到的源文件（token / 修改时间）**、**本次车数**、**已有镜像的 syncedAt / 车数**一起打出来 —— 先据此判断是"取不到文件"还是"取到了陈旧副本"。
          2. 0 车 / 车数回退：检查飞书「同步数据」目录是否存在同名重复文件、改名、移动或权限变更；确认是组长真实下架后，手工 \`--force\` 重跑一次并核对产物。
          3. 凭证类报错（token/列目录）：核对 \`FEISHU_APP_ID\` / \`FEISHU_APP_SECRET\` / \`FEISHU_FOLDER_TOKEN\` 三个 secret 是否仍然有效。

          修好后，下一次成功同步会自动关闭本 issue。

          > 本 issue 由 workflow 自动创建/刷新：每 15 分钟失败只更新正文，不刷评论。
          EOF
          JQ="map(select(.title==\"$TITLE\")) | .[0].number // empty"
          ID=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                 --json number,title --jq "$JQ" || true)
          if [ -n "${ID:-}" ]; then
            gh issue edit "$ID" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
            echo "已刷新自动登记 issue #$ID"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE" --label bug
          fi
