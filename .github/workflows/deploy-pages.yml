name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'demo.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'vehicle_images/**'
      - 'web-data/**'
      - 'manifest.json'
      - 'sw.js'
      - 'feishu-api.js'
      - 'vehicles_data.js'
      - 'version.json'
      - 'media_library.json'
      - 'releases_index.json'
      - 'scripts/prepare_pages.sh'
      - 'icon-*.png'
      - 'icon.svg'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare publish directory
        run: bash scripts/prepare_pages.sh . _publish

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './_publish'

      # V10.27.6: 工件元数据有秒级可见性延迟, 而 deploy-pages 只查一次就失败
      # (报 "No artifacts named github-pages", 但 artifacts 接口随后就能查到)。
      # 2026-11-24 发 v10.27.5 时连续 4 次撞上, 所以先等一会再部署。
      - name: 等待工件元数据可见(Pages 部署竞态)
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true

      # 仍失败时补一次(首次失败发生在"查工件元数据"这一步, 尚未创建部署, 重试安全)
      - name: Deploy to GitHub Pages (重试一次)
        id: deployment_retry
        if: steps.deployment.outcome != 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
