name: iOS CI Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 10.14.1)'
        required: true
        default: '10.15.6'
      build_type:
        description: 'Build type (development=无签名 IPA | release=需要Apple证书)'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - release

permissions:
  contents: write

env:
  # V10.14.1基建修复: macos-latest镜像已移除Xcode 15.4(现仅26.x), 固定旧版本号导致
  # setup-xcode直接报"Could not find Xcode version"; 改用latest-stable随镜像演进, 避免再次过期
  XCODE_VERSION: 'latest-stable'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version from config.xml
        id: ver
        run: |
          # V10.14.1基建修复: macOS BSD grep不支持-P(-oP为GNU扩展), 旧写法在macos runner上
          # 报"grep: invalid option -- P"导致APP_VERSION为空串; 改用BSD/GNU双兼容的sed -nE
          APP_VERSION=$(sed -nE 's/.*[[:space:]]version="([0-9][0-9.]*)".*/\1/p' config.xml | head -1)
          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: 未从config.xml解析到版本号"; exit 1
          fi
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "Detected version=${APP_VERSION}"

      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Cordova & CocoaPods
        run: |
          npm install -g cordova@13
          cordova --version
          brew install cocoapods || true
          pod --version

      # 与 Android 同构构建目录 tcg_app/, 共用 www 源码
      - name: Prepare build environment
        run: |
          mkdir -p tcg_app/www
          cp config.xml tcg_app/config.xml
          cp demo.html tcg_app/www/
          cp feishu-api.js tcg_app/www/
          cp vehicles_data.js tcg_app/www/
          cp -r vendor tcg_app/www/vendor
          cp -r css tcg_app/www/css
          cp -r js tcg_app/www/js
          cp -r vehicle_images tcg_app/www/vehicle_images
          mkdir -p tcg_app/scripts
          cp scripts/patch_projectbuilder.js tcg_app/scripts/

      - name: Verify bundled web assets
        run: |
          for f in tailwind.js xlsx.full.min.js jspdf.umd.min.js jspdf.plugin.autotable.min.js html-docx.js; do
            test -s "tcg_app/www/vendor/$f" || { echo "MISSING vendor/$f"; exit 1; }
          done
          IMG_COUNT=$(ls tcg_app/www/vehicle_images/*.jpeg 2>/dev/null | wc -l)
          echo "vehicle_images count: $IMG_COUNT"
          [ "$IMG_COUNT" -ge 100 ] || { echo "vehicle_images incomplete (<100)"; exit 1; }

      # V10.12: 构建期 Secret 注入
      - name: Inject Feishu build secrets into www/demo.html (strict fail)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          DEMO_HTML_PATH: ${{ github.workspace }}/tcg_app/www/demo.html
          FEISHU_STRICT: '1'
        run: node scripts/inject_build_secrets.js

      - name: Add iOS platform
        working-directory: ./tcg_app
        run: cordova platform add ios@7

      # 安装跨平台插件(排除 Android-only 的 cordova-plugin-android-permissions)
      - name: Install plugins (iOS-safe)
        working-directory: ./tcg_app
        run: |
          cordova plugin add cordova-plugin-whitelist@1.3.5
          cordova plugin add cordova-plugin-device@3.0.0
          cordova plugin add cordova-plugin-network-information@3.0.0
          cordova plugin add cordova-plugin-dialogs@2.0.2
          cordova plugin add cordova-plugin-inappbrowser@6.0.0
          cordova plugin add cordova-plugin-file@8.1.0
          cordova plugin add cordova-plugin-file-transfer@2.0.0
          cordova plugin add cordova-plugin-camera@7.0.0
          cordova plugin add cordova-plugin-media-capture@5.0.0
          cordova plugin add cordova-plugin-geolocation@5.0.0 --variable GPS_REQUIRED=false
          cordova plugin add cordova-plugin-advanced-http@3.3.1
          cordova plugin add cordova-plugin-x-socialsharing@6.0.4
          cordova plugin add cordova-plugin-screen-orientation@3.0.3
          cordova plugin add cordova-plugin-statusbar@4.0.0
          cordova plugin add cordova-plugin-splashscreen@6.0.2
          cordova plugin add cordova-plugin-app-version@0.1.14
          cordova plugin add cordova-plugin-local-notification@1.2.3
          cordova plugin add cordova-plugin-file-opener2@4.0.0

      # ===== 签名分支: development / release =====
      # development: 无签名 IPA(内部测试用), release: 需 Apple 证书 + Provisioning Profile
      - name: Detect Xcode scheme name
        id: scheme
        working-directory: ./tcg_app
        run: |
          # V10.14.1基建修复: Cordova工程scheme列表含 Cordova/CordovaLib(框架库)与应用本体
          # 三项; 旧写法恒取首项(框架库)导致只构建框架不构建APP。修复策略(双保险):
          #   1) 精确匹配: 应用scheme即 config.xml <name>(Cordova工程约定), 列表中存在则直接采用
          #   2) 回退: 前缀排除全部 Cordova 系scheme(Cordova/CordovaLib), 取剩余首项
          ALL_SCHEMES=$(xcodebuild -list -project platforms/ios/*.xcodeproj 2>/dev/null \
            | sed -n '/Schemes:/,$p' | sed '1d;/^[[:space:]]*$/d;s/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "All schemes: ${ALL_SCHEMES}"
          APP_NAME=$(sed -nE 's:.*<name>([^<]+)</name>.*:\1:p' config.xml | head -1 | xargs)
          SCHEME=""
          if [ -n "$APP_NAME" ] && echo "$ALL_SCHEMES" | grep -qxF "$APP_NAME"; then
            SCHEME="$APP_NAME"
          fi
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$ALL_SCHEMES" | grep -v '^Cordova' | head -1)
          fi
          if [ -z "$SCHEME" ]; then
            # fallback: plist CFBundleName
            SCHEME=$(defaults read platforms/ios/*/Info.plist CFBundleName 2>/dev/null || echo "")
          fi
          if [ -z "$SCHEME" ]; then
            echo "ERROR: 未探测到应用 scheme"; exit 1
          fi
          echo "SCHEME=${SCHEME}" >> $GITHUB_ENV
          echo "Detected Xcode scheme: ${SCHEME}"

      - name: Build development IPA (no signing)
        if: ${{ github.event.inputs.build_type == 'development' || github.event_name == 'push' }}
        working-directory: ./tcg_app
        run: |
          # 跳过签名: CODE_SIGNING_ALLOWED=NO
          cordova build ios --device -- --buildFlag="-UseModernBuildSystem=YES"
          # V10.14.1基建修复: cordova-plugin-advanced-http@3.3.1 内置 AFNetworking 直接
          # #import <netinet6/in6.h>, 该头文件自 iOS 26.5 SDK 起为私有模块头, 编译报
          # "Use of private header from outside its module"; <netinet/in.h> 已传递包含
          # in6.h, 删除该冗余 import 语义等价(社区通用解法)。
          # 时序: 置于 cordova build(prepare 阶段会重拷插件源码)之后、xcodebuild 编译之前,
          # 确保补丁不被 prepare 覆盖
          PATCHED=0
          while IFS= read -r f; do
            sed -i '' '/netinet6\/in6\.h/d' "$f"
            echo "[Xcode26 SDK补丁] $f"
            PATCHED=$((PATCHED+1))
          done < <(grep -rl 'netinet6/in6.h' platforms/ios --include='*.m' --include='*.h' 2>/dev/null)
          echo "netinet6 补丁文件数: $PATCHED"
          cd platforms/ios
          # V10.14.1基建修复: 显式 -derivedDataPath 把产物固定到工程内已知路径,
          # 避免落入 ~/Library/Developer/Xcode/DerivedData 导致 Collect IPA 找不到
          xcodebuild -workspace *.xcworkspace -scheme "${SCHEME}" -configuration Debug \
            -destination generic/platform=iOS \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          echo "IPA built (unsigned)"

      - name: Build release IPA (with signing)
        if: github.event.inputs.build_type == 'release'
        working-directory: ./tcg_app
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_P12_BASE64" ] || [ -z "$APPLE_PROVISIONING_PROFILE_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "ERROR: Apple signing secrets incomplete."
            echo "Required: APPLE_P12_BASE64, APPLE_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID"
            echo "Note: Bundle ID is read automatically from config.xml (com.taicanggang.poweroff)"
            exit 1
          fi
          # 解码 P12 证书到临时 Keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -A -P "" -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          # Provisioning Profile
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/build.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/build.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
          # Release build with manual signing
          cordova build ios --release --device -- \
            --buildFlag="-UseModernBuildSystem=YES" \
            --buildFlag="-CODE_SIGN_STYLE=Manual" \
            --buildFlag="-DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            --buildFlag="-CODE_SIGN_IDENTITY=Apple Distribution" \
            --buildFlag="-PROVISIONING_PROFILE_SPECIFIER=TCG Poweroff Release" \
            --keychain "$KEYCHAIN_PATH"

      - name: Collect IPA
        run: |
          # V10.14.1基建修复: 三级回退搜索产物——
          #   优先: 显式 -derivedDataPath build/dd 的确定性输出(scheme=应用本体)
          #   回退1: legacy cordova-ios(<7) platforms/ios/build 输出
          #   回退2: Xcode 默认 DerivedData(Debug-iphoneos, 排除CordovaLib)
          IPA_PATH=$(find tcg_app/platforms/ios/build/dd/Build/Products -maxdepth 2 -name "*.app" 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            IPA_PATH=$(find tcg_app/platforms/ios/build \( -name "*.ipa" -o -name "*.app" \) 2>/dev/null | head -1)
          fi
          if [ -z "$IPA_PATH" ]; then
            IPA_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -path "*iphoneos*" -not -path "*CordovaLib*" 2>/dev/null | head -1)
          fi
          echo "Found: $IPA_PATH"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found, listing build dirs:"
            ls -la tcg_app/platforms/ios/build/ 2>/dev/null || true
            ls -la tcg_app/platforms/ios/build/dd/Build/Products/ 2>/dev/null || true
            exit 1
          fi
          # 如果只找到 .app, 打包成 .ipa
          if [[ "$IPA_PATH" == *.app ]]; then
            mkdir -p Payload
            cp -r "$IPA_PATH" Payload/
            zip -r "tcg_poweroff_v${APP_VERSION}_ios.ipa" Payload/
            rm -rf Payload
          else
            cp "$IPA_PATH" "tcg_poweroff_v${APP_VERSION}_ios.ipa"
          fi
          ls -la "tcg_poweroff_v${APP_VERSION}_ios.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: tcg-poweroff-ios
          path: tcg_poweroff_v${{ env.APP_VERSION }}_ios.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: tcg_poweroff_v${{ env.APP_VERSION }}_ios.ipa
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
