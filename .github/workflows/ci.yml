# =============================================================================
# CI 资产校验 + 单元测试流水线 (落实优化方案「问题5: CI/CD规范化」)
# 触发: 每次 push / PR
# 关卡: 文件完整性 / JS语法 / 关键能力标记 / JSON合法性 / 凭证泄露扫描 / 映射表漂移
#       / 逻辑测试 / 运行时仿真测试 / 版本专项测试(V10.3/V10.4/V10.5)
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Web资产与安全校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # V10.12: 构建期Secret注入前置校验——CI Secrets中若已配置FEISHU_*就校验注入脚本就绪;
      # Pull Requests from fork 无Secrets权限→FEISHU_STRICT=0跳过,不阻断回归测试
      - name: Secret注入基线校验(缺Secrets权限时降级不阻断)
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_STRICT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && '0' || '' }}
        run: node scripts/inject_build_secrets.js --check

      - name: 综合校验(文件/语法/标记/JSON/凭证泄露)
        run: node scripts/validate_web_assets.js

      - name: 映射表一致性校验(与vehicles_data.js无漂移)
        run: node scripts/gen_media_mapping.js --check

      - name: 安装测试依赖(jsdom)
        run: npm ci --ignore-scripts || npm install --no-audit --no-fund

      - name: 逻辑测试(30项)
        run: npm run test:logic

      - name: 运行时仿真测试(21项)
        run: npm run test:runtime

      - name: 版本专项测试(V10.3问题修复61项)
        run: npm run test:v103

      - name: 版本专项测试(V10.4根因修复)
        run: npm run test:v104

      - name: 版本专项测试(V10.5分享真实化+缓存留存)
        run: npm run test:v105

      - name: 版本专项测试(V10.6导出修复+中文PDF/Word真OOXML)
        run: npm run test:v106

      - name: 版本专项测试(V10.7防抖同步+菜单权限收紧)
        run: npm run test:v107

      - name: 版本专项测试(V10.8云同步根治FormData+注册审批回退)
        run: npm run test:v108

      - name: 版本专项测试(V10.9视频分离+UI适配修复)
        run: npm run test:v109

      - name: 版本专项测试(V10.10大文件分片同步+方案对比)
        run: npm run test:v1010

      - name: 版本专项测试(V10.11镜像同步删除传播)
        run: npm run test:v1011

      - name: 版本专项测试(V10.13复杂度治理A3)
        run: npm run test:v1013

      # V10.14.0: 组员零配置同步专项(秘钥闭包永久化/双通道镜像决策/三色横幅/写入深度防御)
      #   - 本地mock飞书全链路 ≈49 项断言, 0 FAIL 才能合并
      #   - 真实跨网络端到端(test:cross)因需飞书 Secret,已从ci.yml去掉(在 release.yml 中按需执行)
      - name: 版本专项测试(V10.14组员零配置镜像同步+横幅防御+脏配置)
        run: npm run test:v1014

      # V10.14.1: 同步配置出口统一专项(js/05-sync.js五处直读localStorage改走getFeishuCfg)
      #   - 组长/组员 × 注入/零本地/脏配置 × 上传/拉取/轮询/导出矩阵 ≈50 项断言, 0 FAIL 才能合并
      - name: 版本专项测试(V10.14.1同步配置出口统一门禁修复)
        run: npm run test:v1015

      - name: 上传校验摘要
        if: always()
        run: |
          echo "## CI 校验结果" >> $GITHUB_STEP_SUMMARY
          echo "- 校验时间: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 版本: $(node -e "console.log(require('./version.json').version)") (versionCode=$(node -e "console.log(require('./version.json').versionCode)"))" >> $GITHUB_STEP_SUMMARY
          echo "- V10.14专项(组员零配置): PASS=$(grep -c 'PASS\]' v1014_report.log 2>/dev/null || echo 0) FAIL=$(grep -c 'FAIL\]' v1014_report.log 2>/dev/null || echo 0) — $(test -s v1014_report.log && node tests/test_v1014_zero_config_member.js 2>&1 | tail -2 | head -1 || echo '见jobs日志')" >> $GITHUB_STEP_SUMMARY
          echo "- 车型映射记录数: $(node -e "console.log(require('./docs/vehicle_media_mapping.json').records.length)")" >> $GITHUB_STEP_SUMMARY
          echo "- 视频待云端补录数: $(node -e "console.log(require('./docs/vehicle_media_mapping.json').records.filter(r=>r['视频匹配状态'].includes('补录')).length)")" >> $GITHUB_STEP_SUMMARY
