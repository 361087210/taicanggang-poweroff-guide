name: Android CI Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 5.3.6)'
        required: true
        default: '5.3.6'

env:
  APP_VERSION: 5.3.6
  BASE: 50306
  JAVA_VERSION: '17'


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: |
          npm install -g cordova@12
          cordova --version

      - name: Prepare build environment
        run: |
          mkdir -p tcg_app/www
          cp config.xml tcg_app/config.xml
          cp demo.html tcg_app/www/
          cp feishu-api.js tcg_app/www/
          cp vehicles_data.js tcg_app/www/
          mkdir -p tcg_app/scripts
          cp scripts/patch_projectbuilder.js tcg_app/scripts/

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Add Android platform
        working-directory: ./tcg_app
        run: cordova platform add android@13

      - name: Install plugins
        working-directory: ./tcg_app
        run: |
          cordova plugin add cordova-plugin-whitelist@1.3.5
          cordova plugin add cordova-plugin-device@3.0.0
          cordova plugin add cordova-plugin-network-information@3.0.0
          cordova plugin add cordova-plugin-dialogs@2.0.2
          cordova plugin add cordova-plugin-inappbrowser@6.0.0
          cordova plugin add cordova-plugin-file@8.1.0
          cordova plugin add cordova-plugin-file-transfer@2.0.0
          cordova plugin add cordova-plugin-camera@7.0.0 --variable ANDROIDX_CORE_VERSION=1.8.+
          cordova plugin add cordova-plugin-media-capture@5.0.0
          cordova plugin add cordova-plugin-geolocation@5.0.0
          cordova plugin add cordova-plugin-advanced-http@3.3.1
          cordova plugin add cordova-plugin-x-socialsharing@6.0.7
          cordova plugin add cordova-plugin-qrscanner@3.0.1
          cordova plugin add cordova-plugin-screen-orientation@3.0.3
          cordova plugin add cordova-plugin-statusbar@4.0.0
          cordova plugin add cordova-plugin-splashscreen@6.0.2
          cordova plugin add cordova-plugin-app-version@0.1.14
          cordova plugin add cordova-plugin-android-permissions@1.1.5
          cordova plugin add cordova-plugin-local-notification@1.2.3
          cordova plugin add cordova-plugin-file-opener2@4.0.0

      - name: Apply ProjectBuilder patch
        working-directory: ./tcg_app
        run: node scripts/patch_projectbuilder.js

      - name: Build release APK
        working-directory: ./tcg_app
        run: cordova build android --release -- --packageType=apk

      - name: Sign APK
        working-directory: ./tcg_app
        run: |
          mkdir -p ../release
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256             -keystore ${{ secrets.KEYSTORE_PATH }}             -storepass ${{ secrets.KEYSTORE_PASSWORD }}             -keypass ${{ secrets.KEY_PASSWORD }}             platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk             ${{ secrets.KEY_ALIAS }}
          zipalign -v 4             platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk             ../release/tcg_poweroff_v${{ env.APP_VERSION }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcg-poweroff-apk
          path: release/tcg_poweroff_v${{ env.APP_VERSION }}.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release/tcg_poweroff_v${{ env.APP_VERSION }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json download URL
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          BUILD_NUM=${{ github.run_number }}
          VERSION_CODE=$((BASE + BUILD_NUM))
          sed -i "s|\"downloadUrl\": \".*\"|\"downloadUrl\": \"https://github.com/361087210/taicanggang-poweroff-guide/releases/download/${TAG}/tcg_poweroff_v${{ env.APP_VERSION }}.apk\"|" version.json
          sed -i "s|\"versionCode\": [0-9]*|\"versionCode\": ${VERSION_CODE}|" version.json
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add version.json
          git commit -m "ci: update version.json downloadUrl for ${TAG} [skip ci]" || true
          git push || true
