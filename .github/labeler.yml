# .github/labeler.yml —— actions/labeler 的路径→标签映射
#
# 为什么必须有这个文件：`.github/workflows/label.yml` 引用了 actions/labeler，
# 但仓库一直没有配置文件 → 该 workflow 自 2026-11-09 起 18 次运行 0 次成功
# （"Configuration file .github/labeler.yml does not exist"）。
#
# 约束：**只能用仓库已存在的标签**，否则 labeler 会因"标签不存在"再次失败。
#   现有标签：accessibility, bug, dependencies, documentation, duplicate,
#            enhancement, good first issue, help wanted, invalid, javascript,
#            question, wontfix
# 需要新标签时先在仓库里建好，再加到这里。

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - 'js/**/*.js'
          - 'scripts/**/*.js'
          - 'tests/**/*.js'
          - 'feishu-api.js'
          - 'sw.js'
          - 'demo.html'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
          - '.github/dependabot.yml'
